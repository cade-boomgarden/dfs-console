services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dfs
      POSTGRES_PASSWORD: dfs
      POSTGRES_DB: dfs
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: .
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DFS_DATABASE_URL: postgresql+psycopg2://dfs:dfs@postgres:5432/dfs
      DFS_REDIS_URL: redis://redis:6379/0
      DFS_JOB_MODE: rq
    ports: ["8000:8000"]
    depends_on: [postgres, redis]
    volumes: [blobs:/app/blobs]

  worker:
    build: .
    command: python -m backend.worker
    env_file: .env
    environment:
      DFS_DATABASE_URL: postgresql+psycopg2://dfs:dfs@postgres:5432/dfs
      DFS_REDIS_URL: redis://redis:6379/0
    depends_on: [postgres, redis]
    volumes: [blobs:/app/blobs]

volumes:
  pgdata:
  blobs:
