[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dfs"
version = "0.1.0"
description = "Simulation-first DFS optimizer (DK NFL Classic)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0,<2.2",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "passlib[argon2]>=1.7",
    "itsdangerous>=2.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "numpy>=1.26",
    "ortools>=9.9",
    "redis>=5.0",
    "rq>=1.16",
    "psycopg[binary]>=3.1",
    # profile refresh job: lazy parquet over nflverse pbp
    "polars>=1.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# offline research scripts (fit_*.py, validate_gamesim.py) -- the running app
# needs only polars, for the profile refresh job
research = ["pyarrow>=15.0", "scipy>=1.12", "nflreadpy>=0.1"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
